server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/fresh_delivery?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.freshdelivery.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

jwt:
  secret: freshDelivery2026SecretKeyForJwtTokenGeneration1234567890
  expiration: 86400000